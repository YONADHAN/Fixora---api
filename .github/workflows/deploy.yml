name: Fixora CI/CD

on:
  push:
    branches:
      - master

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/yonadhan/fixora-api:latest \
            -t ghcr.io/yonadhan/fixora-api:${{ github.sha }} \
            .

      - name: Push Docker image
        run: |
          docker push ghcr.io/yonadhan/fixora-api:latest
          docker push ghcr.io/yonadhan/fixora-api:${{ github.sha }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/fixora

            export IMAGE_TAG=${{ github.sha }}

            docker compose -f docker-compose.prod.yml pull fixora-api
            docker compose -f docker-compose.prod.yml up -d

            docker image prune -f